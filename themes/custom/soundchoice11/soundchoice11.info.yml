name: 'Sound Choice 11'
type: theme
description: 'Sound Choice 11 subtheme based on Bootstrap 5 theme.'
core_version_requirement: '^10.1 || ^11.0'
'base theme': bootstrap5
libraries:
  - soundchoice11/global-styling
ckeditor_stylesheets:
  - css/style.css
ckeditor5-stylesheets:
  - css/ck5style.css
  - css/ckeditor.css
regions:
  header: Header
  video_wallpaper: 'Video wallpaper'
  nav_branding: 'Navigation branding region'
  nav_main: 'Main navigation region'
  nav_additional: 'Additional navigation region (eg search form, social icons, etc)'
  breadcrumb: Breadcrumbs
  content: 'Main content'
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  front_content: 'Front page content'
  footer_1: 'Footer column 1'
  footer_2: 'Footer column 2'
  footer_3: 'Footer column 3'
  footer_4: 'Footer column 4'
  footer_5: 'Footer column 5'
libraries-override:
  bootstrap5/global-styling: false
  bootstrap5/ckeditor5-stylesheets: false
