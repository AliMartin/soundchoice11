id: artist_join
title: 'Join Sound Choice'
description: ''
categories: {  }
elements: |-
  intro:
    '#type': processed_text
    '#text': '<p>Interested in joining Sound Choice? Tell us a little about you and your act. We carefully select the artists we work with, so the more useful information you can give us, the better.</p>'
    '#format': basic_html
  act_name:
    '#type': textfield
    '#title': 'Act name'
    '#required': true
  contact_name:
    '#type': textfield
    '#title': 'Your name'
    '#required': true
    '#attributes':
      autocomplete: name
  email:
    '#type': email
    '#title': 'Email address'
    '#required': true
    '#attributes':
      autocomplete: email
  telephone:
    '#type': tel
    '#title': Telephone
    '#attributes':
      autocomplete: tel
  act_type:
    '#type': select
    '#title': 'Type of act'
    '#required': true
    '#options':
      party_band: 'Party band'
      function_band: 'Function band'
      interactive_band: 'Interactive band'
      tribute_band: 'Tribute band'
      other: Other
  location:
    '#type': textfield
    '#title': 'Where are you based?'
    '#required': true
    '#description': 'Town, city or general area is fine.'
  website:
    '#type': url
    '#title': Website
    '#description': 'If you have one.'
  promo_video:
    '#type': url
    '#title': 'Best promotional video'
    '#required': true
    '#description': 'YouTube, Vimeo or another publicly accessible video.'
  social_media:
    '#type': textfield
    '#title': 'Social media'
    '#description': 'Instagram, Facebook, TikTok or whichever profile best represents the act.'
  typical_fee:
    '#type': textfield
    '#title': 'Typical booking fee'
    '#description': 'An approximate starting price is fine.'
  about:
    '#type': textarea
    '#title': 'Tell us about the act'
    '#required': true
    '#rows': 6
    '#placeholder': 'Tell us what makes the act distinctive, the events you normally perform at and anything else you think we should know.'
  why_sound_choice:
    '#type': textarea
    '#title': 'Why are you interested in Sound Choice?'
    '#rows': 4
    '#required': true
  actions:
    '#type': webform_actions
    '#submit__label': 'Send enquiry'
